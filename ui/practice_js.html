<script>
  // Practice screen. All checking happens on the server (gas/Code.js ->
  // src/core/practiceRun.js); this page only shows the view it gets back.
  // Text from the server is always set with textContent, never as HTML.
  (function () {
    var RING_LENGTH = 2 * Math.PI * 68;
    var page = window.PAGE;
    var view = null;
    var startedAt = Date.now();
    var timer = null;
    var $ = function (id) { return document.getElementById(id); };

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // --- Talking to the server -------------------------------------------
    function call(name, args, onDone) {
      setBusy(true);
      var runner = google.script.run
        .withSuccessHandler(function (result) { setBusy(false); hideError(); onDone(result); })
        .withFailureHandler(function (err) { setBusy(false); showError(err && err.message ? err.message : String(err)); });
      runner[name].apply(runner, args);
    }

    function setBusy(busy) {
      ['submit-button', 'next-button', 'finish-button', 'again-button'].forEach(function (id) { $(id).disabled = busy; });
    }
    function showError(message) { $('error').textContent = message; $('error').hidden = false; }
    function hideError() { $('error').hidden = true; }

    // --- Math text: "1/3 + 1/4" with stacked fractions ---------------------
    // Visual math is aria-hidden; screen readers get the spoken version.
    function mathNodes(text) {
      var wrap = el('span', 'math-text');
      var re = /(\d+)\/(\d+)/g, last = 0, m;
      while ((m = re.exec(text))) {
        if (m.index > last) wrap.appendChild(document.createTextNode(text.slice(last, m.index)));
        var frac = el('span', 'frac');
        frac.appendChild(el('span', '', m[1]));
        frac.appendChild(el('span', '', m[2]));
        wrap.appendChild(frac);
        last = re.lastIndex;
      }
      if (last < text.length) wrap.appendChild(document.createTextNode(text.slice(last)));
      return wrap;
    }

    function renderPrompt(question) {
      var prompt = $('prompt');
      prompt.textContent = '';
      var equation = /=\s*\?\s*$/.test(question.prompt);
      var shown = equation ? question.prompt.replace(/\?\s*$/, '').trim() : question.prompt;
      var visual = mathNodes(shown);
      visual.setAttribute('aria-hidden', 'true');
      prompt.appendChild(visual);
      prompt.appendChild(el('span', 'sr-only', question.spoken));
      $('question-body').className = equation ? 'equation-row' : '';
    }

    function answerInput(className, label, mode) {
      var input = el('input', 'answer-input ' + className);
      input.type = 'text';
      input.inputMode = mode;
      input.setAttribute('aria-label', label);
      input.spellcheck = false;
      return input;
    }

    function renderAnswerArea(question) {
      var area = $('answer-area');
      area.textContent = '';
      var group = el('div', 'equation-row');
      group.setAttribute('role', 'group');
      group.setAttribute('aria-label', 'Your answer');
      if (question.answerType === 'fraction') {
        var whole = answerInput('whole', 'Whole number, leave blank if there is none', 'numeric');
        whole.id = 'answer-whole';
        var num = answerInput('', 'Numerator, the top number', 'numeric');
        num.id = 'answer-num';
        var den = answerInput('', 'Denominator, the bottom number', 'numeric');
        den.id = 'answer-den';
        // Typing "/" in the top box jumps to the bottom box.
        num.addEventListener('keydown', function (e) { if (e.key === '/') { e.preventDefault(); den.focus(); } });
        var stack = el('span', 'frac-input');
        stack.appendChild(num);
        stack.appendChild(el('span', 'bar'));
        stack.appendChild(den);
        group.appendChild(whole);
        group.appendChild(stack);
      } else {
        var input = answerInput('wide', 'Your answer', question.answerType === 'integer' ? 'numeric' : 'decimal');
        input.id = 'answer-text';
        group.appendChild(input);
      }
      area.appendChild(group);
    }

    function answerInputs() { return Array.prototype.slice.call($('answer-area').querySelectorAll('input')); }

    function readAnswer() {
      if (view.question.answerType === 'fraction') {
        return { whole: $('answer-whole').value, num: $('answer-num').value, den: $('answer-den').value };
      }
      return $('answer-text').value;
    }

    function focusFirstAnswerBox() {
      var box = $('answer-num') || $('answer-text');
      if (box) { box.focus(); box.select(); }
    }

    // --- Feedback ----------------------------------------------------------
    var FEEDBACK_LOOK = {
      correct: { icon: '✅', title: 'Correct! Great work.' },
      wrong: { icon: '❌', title: 'Not quite.' },
      simplify: { icon: '💡', title: '' },
      invalid: { icon: '✏️', title: '' },
    };

    function renderFeedback() {
      var box = $('feedback');
      box.textContent = '';
      box.className = 'feedback';
      var fb = view.feedback;
      if (!fb) return;
      var look = FEEDBACK_LOOK[fb.status] || FEEDBACK_LOOK.invalid;
      box.classList.add(fb.status);
      var icon = el('span', 'icon', look.icon);
      icon.setAttribute('aria-hidden', 'true');
      box.appendChild(icon);
      var body = el('div');
      if (look.title) body.appendChild(el('p', 'title', look.title));
      if (fb.answerText) body.appendChild(el('p', '', 'The answer is ' + fb.answerText + '.'));
      body.appendChild(el('p', '', fb.message));
      if (view.done && view.mastered) body.appendChild(el('p', 'title', '🎉 You reached 100 and mastered this skill!'));
      if (view.done) body.appendChild(el('span', 'sr-only', 'Your SmartScore is now ' + view.score + '.'));
      box.appendChild(body);
    }

    // --- Score and session panel ------------------------------------------
    function renderScore() {
      var score = view.score;
      $('score-value').textContent = score;
      $('ring-bar').style.strokeDasharray = RING_LENGTH;
      $('ring-bar').style.strokeDashoffset = RING_LENGTH * (1 - score / 100);
      $('score-ring').setAttribute('class', 'ring' + (view.mastered ? ' mastered' : view.inChallengeZone ? ' challenge' : ''));
      $('score-ring').setAttribute('aria-label', 'SmartScore ' + score + ' out of 100');
      var change = $('score-change');
      change.className = 'score-change' + (view.scoreChange > 0 ? ' up' : view.scoreChange < 0 ? ' down' : '');
      change.textContent = view.scoreChange > 0 ? '▲ +' + view.scoreChange : view.scoreChange < 0 ? '▼ ' + view.scoreChange : '';

      var msg = $('score-message');
      msg.textContent = '';
      if (view.mastered) {
        msg.appendChild(el('strong', '', 'Mastered!'));
        msg.appendChild(document.createTextNode(' You reached 100 on this skill.'));
      } else if (view.inChallengeZone) {
        msg.appendChild(document.createTextNode('You\'re in the '));
        msg.appendChild(el('span', 'zone', 'Challenge Zone'));
        msg.appendChild(document.createTextNode('! Reach 100 to master this skill.'));
      } else {
        msg.appendChild(document.createTextNode('Keep going! At '));
        msg.appendChild(el('strong', '', '90'));
        msg.appendChild(document.createTextNode(' you\'ll enter the '));
        msg.appendChild(el('span', 'zone', 'Challenge Zone'));
        msg.appendChild(document.createTextNode('.'));
      }
      $('stat-answered').textContent = view.answered;
      $('stat-correct').textContent = view.correct + ' of ' + view.answered;
    }

    function formatTime(seconds) {
      var s = Math.max(0, Math.floor(seconds));
      var m = Math.floor(s / 60);
      return m + ':' + String(s % 60).padStart(2, '0');
    }
    function tick() { $('stat-time').textContent = formatTime((Date.now() - startedAt) / 1000); }

    // --- Screens -----------------------------------------------------------
    // fresh: a new question is on screen (clear the inputs and hint).
    function show(newView, fresh) {
      view = newView;
      $('loading').hidden = true;
      $('summary').hidden = true;
      $('practice').hidden = false;
      $('question-number').textContent = 'Question ' + view.number;
      if (fresh) {
        renderPrompt(view.question);
        renderAnswerArea(view.question);
        $('hint').hidden = true;
        $('hint').textContent = view.question.hint;
        $('hint-button').setAttribute('aria-expanded', 'false');
        $('hint-button').hidden = !view.question.hint;
      }
      renderFeedback();
      renderScore();
      answerInputs().forEach(function (input) { input.disabled = view.done; });
      $('submit-button').hidden = view.done;
      $('next-button').hidden = !view.done;
      $('next-button').textContent = view.mastered ? 'See my results →' : 'Next question →';
      if (view.done) $('next-button').focus();
      else focusFirstAnswerBox();
    }

    function showSummary(stats) {
      clearInterval(timer);
      $('practice').hidden = true;
      $('summary').hidden = false;
      $('summary-title').textContent = stats.mastered ? 'You mastered ' + page.skill.id + '!' : 'Nice work!';
      $('summary-text').textContent = 'Your SmartScore went from ' + stats.startScore + ' to ' + stats.score + '.';
      var list = $('summary-stats');
      list.textContent = '';
      [['Questions answered', stats.answered], ['Correct', stats.correct + ' of ' + stats.answered],
        ['Accuracy', stats.accuracy + '%'], ['Time spent', formatTime(stats.seconds)]].forEach(function (row) {
        var div = el('div');
        div.appendChild(el('dt', '', row[0]));
        div.appendChild(el('dd', '', String(row[1])));
        list.appendChild(div);
      });
      $('summary-title').setAttribute('tabindex', '-1');
      $('summary-title').focus();
      $('finish-button').hidden = true;
    }

    function start() {
      $('loading').hidden = false;
      $('practice').hidden = true;
      $('summary').hidden = true;
      $('finish-button').hidden = false;
      startedAt = Date.now();
      clearInterval(timer);
      timer = setInterval(tick, 1000);
      tick();
      call('practiceStart', [page.skill.id], function (v) { show(v, true); });
    }

    // --- Events ------------------------------------------------------------
    $('answer-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!view || view.done || $('submit-button').disabled) return;
      call('practiceAnswer', [view.id, readAnswer()], function (v) { show(v, false); });
    });
    $('next-button').addEventListener('click', function () {
      if (view.mastered) { $('finish-button').click(); return; }
      call('practiceNext', [view.id], function (v) { show(v, true); });
    });
    $('finish-button').addEventListener('click', function () {
      if (!view) return;
      call('practiceFinish', [view.id], showSummary);
    });
    $('again-button').addEventListener('click', start);
    $('hint-button').addEventListener('click', function () {
      var open = $('hint').hidden;
      $('hint').hidden = !open;
      this.setAttribute('aria-expanded', String(open));
    });

    if (!('speechSynthesis' in window)) {
      $('read-button').hidden = true;
    } else {
      $('read-button').addEventListener('click', function () {
        if (!view) return;
        var parts = [view.question.spoken];
        var fb = view.feedback;
        if (fb) {
          var look = FEEDBACK_LOOK[fb.status];
          if (look && look.title) parts.push(look.title);
          parts.push(fb.spoken);
        }
        if (!$('hint').hidden) parts.push('Hint: ' + view.question.hint);
        window.speechSynthesis.cancel();
        var speech = new SpeechSynthesisUtterance(parts.join(' '));
        speech.lang = 'en-US';
        speech.rate = 0.9;
        window.speechSynthesis.speak(speech);
      });
    }

    $('user-email').textContent = page.email;
    $('crumb-grade').textContent = 'Grade ' + page.skill.grade;
    $('crumb-category').textContent = page.skill.id.split('.')[0] + '. ' + page.skill.category;
    $('crumb-skill').textContent = page.skill.id + ' ' + page.skill.title;
    start();
  })();
</script>
